name: flood2food
description: "Flood2Food - Precision Agriculture IoT"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.0
  http: ^1.3.0
  fl_chart: ^0.70.2
  intl: ^0.20.2
  google_fonts: ^6.2.1
  lottie: ^3.3.1
  flutter_dotenv: ^5.1.0
  shared_preferences: ^2.3.0
  flutter_blue_plus: ^1.35.2
  flutter_foreground_task: ^9.2.2
  path_provider: ^2.1.4
  share_plus: ^13.1.0
  dio: ^5.7.0
  llamadart: ^0.8.4
  flutter_markdown: ^0.7.7+1
  markdown: ^7.3.1
  flutter_highlighter: any
  uuid: ^4.5.3
  image_picker: ^1.2.2
  firebase_core: ^3.1.0
  cloud_firestore: ^5.0.0
  firebase_auth: ^5.1.0
  google_sign_in: ^6.2.1
  flutter_animate: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/data_npk.csv
    - assets/splash.jpg
    - assets/profile.jpg
    - assets/google_ai.png
    - assets/nvidia_nim.png
    - assets/openrouter.png
    - assets/local_ai.png
    - .env

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/app_logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#051A15"
  adaptive_icon_foreground: "assets/app_logo.png"
